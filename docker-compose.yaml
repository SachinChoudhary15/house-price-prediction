
services:

  api:
    build: .
    container_name: house-price-api
    ports:
      - "8000:8000"
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000

  frontend:
    build: .
    container_name: house-price-frontend
    ports:
      - "8501:8501"
    command: streamlit run frontend/app.py --server.address=0.0.0.0 --server.port=8501
    depends_on:
      - api